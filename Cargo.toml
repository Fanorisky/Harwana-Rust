[package]
name = "harwana"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "gamemodes/lib.rs"

[dependencies]
omp = {path="deps/omp"}
omprs-command = {path="deps/omprs-command"}
once_cell = "1.21.3"
ctor = "0.2"
strsim = "0.10"
rand = "0.8.5"
mysql_async = "0.33"
tokio = { version = "1", features = ["full"] }

[profile.dev]
opt-level = 0          
debug = true           
incremental = true     
codegen-units = 256    
lto = false            
panic = "abort"        

