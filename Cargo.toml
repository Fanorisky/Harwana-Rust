[package]
name = "harwana"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
omp = {path="deps/omp"}
rand = "0.8.5"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.dev]
opt-level = 0          
debug = true           
incremental = true     
codegen-units = 256    
lto = false            
panic = "abort"        

